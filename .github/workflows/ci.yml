name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build core
        run: lake build
      - name: Build examples
        run: |
          for d in examples/*/; do
            if [ -f "$d/lakefile.toml" ]; then
              echo "::group::$d"
              (cd "$d" && lake build && if [ -x check.sh ]; then ./check.sh; fi)
              echo "::endgroup::"
            fi
          done
      - name: Build the why-query benchmark and check its tasks
        run: |
          cd bench/why-queries
          lake build
          for f in irrigation library notify access deploy hidden-access hidden-deploy; do
            .lake/build/bin/why expect "${f#hidden-}" "inputs/$f.json" > "/tmp/$f.json"
            diff -u "vectors/$f.json" "/tmp/$f.json"
          done
          python3 bench.py check
      - name: No sorry or new axioms
        run: |
          if grep -rnE '\bsorry\b|^\s*axiom\s' --include='*.lean' Tribrach examples bench; then
            echo "Found sorry or axiom"; exit 1
          fi

  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check capture goldens
        run: |
          pip install --quiet "jsonschema==4.26.0"
          python tools/check_captures.py

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Commit $c has no Signed-off-by line"; missing=1
            fi
          done
          exit $missing
